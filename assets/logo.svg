<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3542"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fb2ff"/>
      <stop offset="100%" stop-color="#0057ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3d8bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3d8bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="320" cy="320" r="300" fill="url(#glow)"/>
  <circle cx="320" cy="320" r="260" fill="none" stroke="#0057ff" stroke-width="6" opacity="0.18"/>

  <g transform="translate(150,150)">
    <!-- lid -->
    <rect x="10" y="0" width="180" height="34" rx="14" fill="url(#binGrad)"/>
    <!-- body -->
    <path d="M20 46 h160 l-16 210 a20 20 0 0 1 -20 18 h-88 a20 20 0 0 1 -20 -18 z" fill="url(#binGrad)"/>
    <!-- face cutout highlight (arms) -->
    <path d="M55 80 q10 -26 34 -18 q14 8 6 30 q-8 20 -30 14 q-16 -6 -10 -26 z" fill="#3a4553"/>
    <path d="M155 80 q-10 -26 -34 -18 q-14 8 -6 30 q8 20 30 14 q16 -6 10 -26 z" fill="#3a4553"/>
    <!-- sunglasses -->
    <rect x="46" y="96" width="52" height="26" rx="12" fill="#0b0d10"/>
    <rect x="112" y="96" width="52" height="26" rx="12" fill="#0b0d10"/>
    <rect x="98" y="103" width="14" height="8" rx="4" fill="#0b0d10"/>
    <!-- smile -->
    <path d="M70 150 q40 34 80 0" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M96 160 q14 10 28 0" stroke="#0057ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- arm holding wand -->
  <path d="M330 260 q60 -10 90 -60" stroke="#12161c" stroke-width="22" fill="none" stroke-linecap="round"/>
  <circle cx="424" cy="196" r="20" fill="#0057ff"/>
  <rect x="424" y="150" width="70" height="26" rx="10" fill="#12161c" transform="rotate(-18 424 150)"/>

  <!-- water splash -->
  <g fill="url(#waterGrad)">
    <circle cx="520" cy="120" r="8"/>
    <circle cx="540" cy="150" r="6"/>
    <circle cx="560" cy="100" r="5"/>
    <path d="M498 150 q30 -50 60 -70 q-10 34 -30 58 q-14 16 -30 12z"/>
  </g>

  <!-- wordmark -->
  <text x="320" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="66" fill="#12161c">CAN</text>
  <text x="320" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="78" fill="#0057ff">BOYS</text>
  <text x="320" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#12161c">WE CLEAN. YOU RELAX.</text>
</svg>
